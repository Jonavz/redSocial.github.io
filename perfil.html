<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Perfil - Jonathan Velez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="CSS/estilito.css" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/main.js"></script>

  <style>
    .perfil-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #ddd;
    }

    .contador {
      text-align: center;
    }

    .contador span {
      display: block;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .contador small {
      color: #777;
    }

    .perfil-descripcion {
      font-size: 0.95rem;
    }

    .separador-tabs {
      border-bottom: 1px solid #ddd;
      margin-top: 20px;
      padding-bottom: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container mt-4">

    <div class="row align-items-center mb-4">
      <div class="col-4 text-center">
        <img src="https://picsum.photos/id/91/3504/2336" alt="Perfil" class="perfil-img">
      </div>
      <div class="col-8">
        <h4 class="mb-1">Jonathan Velez</h4>
        <p class="perfil-descripcion">Estudiante de programacion</p>
        <div class="d-flex justify-content-start mt-3">
          <div class="me-4 contador">
            <span>890</span>
            <small>Seguidores</small>
          </div>
          <div class="me-4 contador">
            <span>143</span>
            <small>Seguidos</small>
          </div>
          <div class="contador">
            <span>27</span>
            <small>Publicaciones</small>
          </div>
        </div>
      </div>
    </div>

    <div class="separador-tabs text-center">
      Mis Publicaciones
    </div>

    <div class="row g-4 mt-3 mb-5">
  
        <div class="col-6 col-md-4 col-lg-3">
            <div class="card shadow-sm">
                <img src="https://picsum.photos/seed/user1/500/500" class="card-img-top" alt="Post 1">
                <div class="card-body">
                <button class="btn btn-outline-danger btn-like" data-liked="false">❤ 42 Likes</button>
              </div>
            </div>
          </div>
        <div class="col-6 col-md-4 col-lg-3">
            <div class="card shadow-sm">
                <img src="https://picsum.photos/seed/user2/500/500" class="card-img-top" alt="Post 2">
                <div class="card-body">
                <button class="btn btn-outline-danger btn-like" data-liked="false">❤ 42 Likes</button>
              </div>
            </div>
          </div>
        <div class="col-6 col-md-4 col-lg-3">
          <div class="card shadow-sm">
            <img src="https://picsum.photos/seed/user3/500/500" class="card-img-top" alt="Post 3">
            <div class="card-body">
              <button class="btn btn-outline-danger btn-like" data-liked="false">❤ 42 Likes</button>
            </div>
          </div>
        </div>

        <div class="col-6 col-md-4 col-lg-3">
            <div class="card shadow-sm">
                <img src="https://picsum.photos/seed/user4/500/500" class="card-img-top" alt="Post 4">
                <div class="card-body">
                <button class="btn btn-outline-danger btn-like" data-liked="false">❤ 42 Likes</button>
              </div>
            </div>
          </div>
  
      </div>
  </div>

</body>
</html>
